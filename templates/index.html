
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DIAR Diploma System</title>
</head>
<body>
    <h1>DIAR</h1>
    <h2>Diploma Integrity Authentication Record</h2>

    <p>Generate, register and verify academic diplomas.</p>

    <h3>Issue New Diploma</h3>
    <form method="POST">
        <label for="name">Student name:</label><br>
        <input id="name" name="name" required><br><br>

        <label for="course">Course:</label><br>
        <input id="course" name="course" required><br><br>

        <button type="submit">Generate Diploma</button>
    </form>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    <hr>
    <h3>Verify Existing Diploma</h3>
    <form id="lookupForm">
        <label for="lookupId">Diploma ID:</label><br>
        <input id="lookupId" required
               pattern="[0-9a-fA-F]{16}"
               placeholder="Enter 16-character ID">
        <button type="submit">Verify Diploma</button>
    </form>

    <script>
        document.getElementById("lookupForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const id = document.getElementById("lookupId").value.trim();

            if (!/^[0-9a-fA-F]{16}$/.test(id)) {
                alert("Enter a valid 16-character diploma ID.");
                return;
            }

            window.location.href = "/verify/" + encodeURIComponent(id);
        });
    </script>
</body>
</html>
